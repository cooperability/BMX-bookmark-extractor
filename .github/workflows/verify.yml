name: Verify

# Deploys are owned by the Vercel Git integration, not by this workflow.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: 'yarn.lock'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn run lint

      - name: Typecheck
        run: yarn run check

      - name: Unit tests
        run: yarn run test:server

      # Actions owns the build signal. Without this the only proof the app
      # compiles came from the Vercel Git integration, so a project-settings
      # fault and a genuine build break were indistinguishable from here.
      - name: Build
        run: yarn run build

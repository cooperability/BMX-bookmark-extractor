version: 2
updates:
  # The app (SvelteKit) now lives at the repo root.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    # Later releases pull jsdom 27+, which needs require(esm), and Vercel's runtime
    # refuses it (#345). The e2e guard in playwright.config.ts fails those bumps anyway.
    ignore:
      - dependency-name: 'isomorphic-dompurify'
        versions: ['>2.26.0']
    groups:
      svelte:
        patterns:
          - '@sveltejs/*'
          - 'svelte*'
      testing:
        patterns:
          - '@playwright/*'
          - 'playwright'
          - '@vitest/*'
          - 'vitest'
      eslint:
        patterns:
          - 'eslint*'
          - '@eslint/*'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
